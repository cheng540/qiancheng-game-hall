<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#140c2e">
<title>今晚聊什么 · 千城游戏厅</title>
<style>
  :root{
    --gold:#ffd774; --ink:#fff6e8; --muted:#b9a8d8; --purple:#a98bf5;
    --card:#241a3d; --line:#ffffff1f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    font-family:'Microsoft YaHei','PingFang SC',sans-serif;
    background:#140c2e;color:var(--ink);overflow:hidden;user-select:none;-webkit-user-select:none;
    touch-action:manipulation;
  }
  /* ---------- 背景：两团缓慢漂浮的光 ---------- */
  .bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:
    radial-gradient(ellipse 70% 55% at 50% -10%,#3d2a6b 0%,transparent 60%),
    radial-gradient(ellipse 60% 50% at 15% 100%,#2a1b4d 0%,transparent 55%),
    #140c2e;}
  .glow{position:absolute;border-radius:50%;filter:blur(46px);opacity:.5;animation:float 14s ease-in-out infinite}
  .glow.g1{width:260px;height:260px;background:#8a5fe0;left:-60px;top:10%}
  .glow.g2{width:220px;height:220px;background:#f07f3c;right:-50px;top:38%;animation-delay:-5s;opacity:.32}
  .glow.g3{width:200px;height:200px;background:#3f8fe0;left:45%;bottom:-60px;animation-delay:-9s;opacity:.3}
  @keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(18px,-22px) scale(1.08)}66%{transform:translate(-14px,16px) scale(.95)}}

  #app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;padding:0 16px calc(12px + env(safe-area-inset-bottom))}
  /* ---------- 顶栏 ---------- */
  header{display:flex;align-items:center;gap:10px;padding:14px 0 8px;flex:none}
  .back{width:38px;height:38px;flex:none;border:1px solid var(--line);background:#ffffff14;color:var(--ink);
    border-radius:13px;font-size:20px;line-height:1;display:grid;place-items:center;cursor:pointer}
  .back:active{transform:scale(.94)}
  .brand{display:flex;flex-direction:column;gap:1px;flex:1;min-width:0}
  .brand b{font-size:19px;letter-spacing:.5px;background:linear-gradient(100deg,#fff 20%,var(--gold) 70%);
    -webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}
  .brand small{font-size:10.5px;color:var(--muted);letter-spacing:1.6px}
  /* 房间号：放在标题与计数之间的空白处，点一下可复制 */
  .code{border:1px solid #ffd7743d;background:#ffd77414;color:var(--gold);font:11px/1 inherit;
    padding:7px 10px;border-radius:11px;white-space:nowrap;flex:none;cursor:pointer;
    display:flex;align-items:center;gap:5px;transition:background .15s,transform .1s}
  .code b{font-size:13px;font-weight:800;letter-spacing:1.2px;font-variant-numeric:tabular-nums}
  .code i{font-style:normal;font-size:9px;opacity:.7}
  .code:active{transform:scale(.95);background:#ffd77426}
  .cnt{font-size:11px;color:var(--muted);text-align:right;line-height:1.4;flex:none}
  .cnt b{color:var(--gold);font-size:15px}

  /* ---------- 分类 ---------- */
  .cats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:6px 0 8px;flex:none}
  .cat{border:1px solid var(--line);background:#ffffff0d;border-radius:15px;padding:8px 2px;
    display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink);cursor:pointer;
    font:inherit;transition:transform .12s,background .18s,border-color .18s}
  .cat i{font-style:normal;font-size:16px;line-height:1.15}
  .cat b{font-size:10.5px;white-space:nowrap;font-weight:700}
  .cat:active{transform:scale(.95)}
  .cat.on{background:linear-gradient(150deg,#b48cff,#7d54d8);border-color:transparent;box-shadow:0 6px 18px #a787de44}
  .cat.on b{color:#fff}

  /* ---------- 标签 ---------- */
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;flex:none}
  .tag{border:1px solid var(--line);background:#ffffff0d;color:var(--muted);border-radius:20px;
    padding:5px 12px;font:11.5px/1 inherit;cursor:pointer;transition:all .15s}
  .tag.on{background:#a98bf52b;color:#d9c9ff;border-color:#a98bf5;font-weight:700}
  .tag:active{transform:scale(.95)}

  /* ---------- 卡片舞台 ---------- */
  .stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;perspective:1200px;padding:4px 0}
  .qcard{position:relative;width:100%;max-width:420px;height:100%;max-height:390px;min-height:210px;
    transform-style:preserve-3d;transition:transform .58s cubic-bezier(.2,.85,.25,1);cursor:pointer}
  .qcard.flipped{transform:rotateY(180deg)}
  .qface{position:absolute;inset:0;border-radius:26px;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;
    border:1px solid #ffffff26;box-shadow:0 18px 46px #0000005c}
  .qback{background:
      repeating-linear-gradient(45deg,#2b2050 0 12px,#241a45 12px 24px);
    border-color:#a98bf53d}
  .qback span{font-size:64px;font-weight:900;color:#ffffff1f;line-height:1;text-shadow:0 0 40px #a98bf53d}
  .qback small{margin-top:12px;font-size:12px;color:#ffffff59;letter-spacing:3px}
  .qback::after{content:'';position:absolute;inset:10px;border-radius:20px;border:1px dashed #a98bf53d}
  .qfront{transform:rotateY(180deg);
    background:linear-gradient(155deg,#372a55 0%,#241a3d 60%,#2a1f45 100%)}
  .qfront::before{content:'“';position:absolute;left:18px;bottom:-46px;font-size:150px;line-height:1;
    color:#ffffff0a;font-family:Georgia,serif;pointer-events:none}
  .qhint{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:10px;color:#ffffff3d;letter-spacing:2px}
  .qbadge{position:absolute;top:16px;left:16px;font-size:10.5px;color:#140c2e;font-weight:800;
    background:linear-gradient(140deg,#ffd774,#f2a63b);padding:3px 10px;border-radius:20px}
  .qtags{position:absolute;top:18px;right:16px;font-size:10px;color:var(--muted)}
  .qtext{margin:0;font-size:clamp(17px,4.6vw,26px);line-height:1.6;font-weight:800;text-align:center;
    letter-spacing:.3px;color:#fff;text-shadow:0 2px 14px #00000059;max-height:100%;overflow:auto}
  .qtext.in{animation:qin .42s cubic-bezier(.2,.9,.3,1) both}
  @keyframes qin{from{opacity:0;transform:translateY(14px) scale(.96);filter:blur(4px)}
                 to{opacity:1;transform:none;filter:none}}
  .qcard.noflip .qpos{animation:qin .42s both}

  /* ---------- 操作区 ---------- */
  .ops{flex:none;display:flex;flex-direction:column;gap:9px;padding-top:12px}
  .row{display:flex;gap:9px;align-items:center}
  button{font:inherit}
  .btn{border:1px solid var(--line);background:#ffffff14;color:var(--ink);border-radius:15px;
    padding:12px 16px;cursor:pointer;transition:transform .1s,background .15s}
  .btn:active{transform:scale(.97)}
  .btn.main{flex:1;border:0;background:linear-gradient(145deg,#ffd774,#f2a63b);color:#4a2a05;
    font-weight:800;font-size:15.5px;box-shadow:0 8px 22px #f2a63b3d,0 3px 0 #b97f1e}
  .btn.main:active{box-shadow:0 4px 12px #f2a63b33,0 1px 0 #b97f1e;transform:translateY(2px) scale(.99)}
  .btn.ghost{font-size:13px;padding:12px 14px;color:var(--muted)}
  .btn.ghost.warn{color:#ff9d9d}

  /* ---------- 暧昧开关 ---------- */
  .adult{display:flex;align-items:center;gap:10px;background:#ffffff0a;border:1px solid var(--line);
    border-radius:15px;padding:10px 13px;flex:none;cursor:pointer}
  .adult .ai{font-size:17px;line-height:1}
  .adult .at{flex:1;min-width:0}
  .adult .at b{display:block;font-size:12.5px}
  .adult .at small{display:block;font-size:10.5px;color:var(--muted);margin-top:1px}
  .sw{position:relative;width:46px;height:26px;flex:none}
  .sw input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
  .sw i{position:absolute;inset:0;border-radius:20px;background:#ffffff26;transition:background .2s}
  .sw i::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
    background:#fff;transition:transform .2s;box-shadow:0 2px 6px #0006}
  .sw input:checked + i{background:linear-gradient(140deg,#ff8fa8,#e0456b)}
  .sw input:checked + i::after{transform:translateX(20px)}
  .sw.on + .at b{color:#ffc3cf}

  /* ---------- 大屏 ---------- */
  .big{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:26px;
    background:radial-gradient(ellipse 60% 50% at 50% 40%,#2a1b4d,#0a0616 75%)}
  .big.show{display:flex;animation:fin .3s ease}
  @keyframes fin{from{opacity:0}to{opacity:1}}
  .big p{max-width:920px;text-align:center;font-size:clamp(26px,6.6vw,54px);line-height:1.5;font-weight:900;
    color:#fff6e6;margin:0;text-shadow:0 4px 30px #ffd77433;animation:breathe 4s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:.92;transform:scale(1)}50%{opacity:1;transform:scale(1.015)}}
  .big small{position:absolute;bottom:26px;left:0;right:0;text-align:center;color:#ffffff4d;font-size:11px;letter-spacing:2px}

  .toast{position:fixed;left:50%;top:16%;transform:translate(-50%,-8px);background:#ffd774;color:#3a2a05;
    font-size:12.5px;font-weight:700;padding:8px 16px;border-radius:20px;opacity:0;pointer-events:none;
    transition:opacity .2s,transform .2s;z-index:60}
  .toast.on{opacity:1;transform:translate(-50%,0)}

  @media (max-height:640px){
    .cat small{display:none}
    .stage{max-height:none}
    .qcard{max-height:300px}
    .qtext{font-size:clamp(15px,4.2vw,20px)}
  }
</style>
</head>
<body>
<div class="bg"><i class="glow g1"></i><i class="glow g2"></i><i class="glow g3"></i></div>

<div id="app">
  <header>
    <button class="back" id="btnBack" type="button" aria-label="返回">‹</button>
    <div class="brand"><b>今晚聊什么</b><small>PARTY TOPICS</small></div>
    <button class="code" id="roomCode" type="button" hidden><span>房间</span><b id="roomCodeNum"></b><i>复制</i></button>
    <div class="cnt">已抽 <b id="cntN">0</b> 题<br>可抽 <span id="cntPool">0</span> 题</div>
  </header>

  <div class="cats" id="cats"></div>
  <div class="tags" id="tags"></div>

  <div class="stage">
    <div class="qcard" id="qcard">
      <div class="qface qback"><span>?</span><small>点一下抽题</small></div>
      <div class="qface qfront">
        <span class="qbadge" id="qbadge">真心话</span>
        <span class="qtags" id="qtags"></span>
        <p class="qtext" id="qtext">准备好了吗？</p>
        <span class="qhint">点卡片也能抽 / 空格键</span>
      </div>
    </div>
  </div>

  <div class="ops">
    <div class="row">
      <button class="btn main" id="btnDraw" type="button">🎲 抽一张</button>
      <button class="btn ghost" id="btnBig" type="button">大屏</button>
      <button class="btn ghost warn" id="btnReset" type="button">重置</button>
    </div>
    <label class="adult" id="adultRow">
      <span class="ai">🔞</span>
      <span class="at"><b>暧昧 / 成人向题目</b><small>默认关闭，打开后才会抽到这类题</small></span>
      <span class="sw" id="swWrap"><input type="checkbox" id="adultSw"><i></i></span>
    </label>
  </div>
</div>

<div class="big" id="big"><p id="bigText"></p><small>点任意处关闭</small></div>
<div class="toast" id="toast"></div>

<script src="/platform/sfx.js"></script>
<script src="/platform/party-bank.js"></script>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const EMBED = /[?&]embed=1/.test(location.search);
  const ROOM_CODE = new URLSearchParams(location.search).get('code') || '';
  const B = window.QCTruthBank;
  const sfx = (n, a) => { try { window.QCSFX?.play(n, a); } catch (e) { } };

  let cat = 'truth', tagSet = null, adult = false;
  let used = new Set(), flipped = false, busy = false, drawing = false;

  const norm = s => String(s || '').replace(/\s+/g, ' ').trim();
  const tagByKey = k => B?.TAGS.find(t => t.key === k);
  const catByKey = k => B?.CATS.find(c => c.key === k) || B?.CATS[0];

  function tags() {
    if (!B) return [];
    if (!tagSet) tagSet = new Set(B.TAGS.filter(t => t.def).map(t => t.key));
    return B.TAGS;
  }
  function activeTags() {
    return tags().filter(t => tagSet.has(t.key) && (!t.adult || adult)).map(t => t.key);
  }
  function pool() { return B ? B.pool([cat], activeTags()) : []; }

  /* ---------------- 渲染 ---------------- */
  function renderCats() {
    const box = $('cats');
    box.innerHTML = (B?.CATS || []).map(c =>
      `<button class="cat ${cat === c.key ? 'on' : ''}" data-cat="${c.key}" type="button"><i>${c.icon}</i><b>${c.name}</b></button>`
    ).join('');
    box.querySelectorAll('[data-cat]').forEach(b => b.onclick = () => {
      if (cat === b.dataset.cat) return;
      cat = b.dataset.cat; used.clear(); renderCats(); renderTags(); updateCount(); sfx('select');
    });
  }
  function renderTags() {
    const box = $('tags');
    const list = tags().filter(t => !t.adult);
    box.innerHTML = list.map(t =>
      `<button class="tag ${tagSet.has(t.key) ? 'on' : ''}" data-tag="${t.key}" type="button">${t.name}</button>`
    ).join('');
    box.querySelectorAll('[data-tag]').forEach(b => b.onclick = () => {
      const k = b.dataset.tag;
      if (tagSet.has(k)) tagSet.delete(k); else tagSet.add(k);
      if (!tagSet.size) tagSet.add(k);          // 至少留一个
      renderTags(); updateCount(); sfx('select');
    });
  }
  function updateCount() {
    const p = pool();
    $('cntPool').textContent = p.length;
    $('cntN').textContent = [...used].filter(q => p.includes(q)).length;
  }

  /* ---------------- 抽题（3D 翻卡） ---------------- */
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  function setFront(q, catKey, tagNames) {
    const c = catByKey(catKey);
    $('qbadge').textContent = c.icon + ' ' + c.name;
    $('qtags').textContent = tagNames;
    const el = $('qtext');
    el.textContent = q;
    el.classList.remove('in');
    void el.offsetWidth;
    el.classList.add('in');
  }
  async function draw() {
    if (busy || !B) return;
    const p = pool();
    if (!p.length) { toast('这个组合下没有题，换一个题材'); sfx('error'); return; }
    let avail = p.filter(q => !used.has(q));
    if (!avail.length) { used.clear(); avail = p; toast('这一轮抽完了，从头再来'); }
    const q = avail[Math.floor(Math.random() * avail.length)];
    used.add(q);
    busy = true;
    const names = activeTags().map(k => tagByKey(k)?.name).filter(Boolean).join(' · ');
    const card = $('qcard');
    if (flipped) {
      card.classList.remove('flipped');
      await sleep(260);
      setFront(q, cat, names);
      await sleep(40);
      card.classList.add('flipped');
      await sleep(300);
    } else {
      setFront(q, cat, names);
      await sleep(50);
      card.classList.add('flipped');
      flipped = true;
      await sleep(320);
    }
    flipped = true;
    busy = false;
    sfx('reveal');
    setTimeout(() => sfx('heart'), 180);
    updateCount();
  }

  /* ---------------- 大屏 ---------------- */
  function showBig() {
    const t = norm($('qtext').textContent);
    if (!t || t === '准备好了吗？') { toast('先抽一题'); return; }
    $('bigText').textContent = t;
    $('big').classList.add('show');
    sfx('levelup');
  }

  let tT = null;
  function toast(msg) {
    const el = $('toast');
    el.textContent = msg; el.classList.add('on');
    clearTimeout(tT); tT = setTimeout(() => el.classList.remove('on'), 1600);
  }

  /* ---------------- 事件 ---------------- */
  $('btnDraw').onclick = draw;
  $('qcard').onclick = draw;
  $('btnBig').onclick = showBig;
  $('big').onclick = () => $('big').classList.remove('show');
  $('btnReset').onclick = () => { used.clear(); updateCount(); toast('已重置本轮'); sfx('toggle'); };
  $('btnBack').onclick = () => {
    if (EMBED) { try { window.parent.postMessage({ type: 'q-back' }, '*'); } catch (e) { } }
    else if (history.length > 1) history.back();
    else location.href = '/';
  };
  $('adultSw').onchange = e => {
    adult = e.target.checked;
    if (adult) tagSet.add('spicy'); else tagSet.delete('spicy');
    $('swWrap').classList.toggle('on', adult);
    updateCount();
    toast(adult ? '已打开暧昧题（18+）' : '已关闭暧昧题');
    sfx(adult ? 'levelup' : 'toggle');
  };
  addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); draw(); }
    if (e.code === 'Escape') $('big').classList.remove('show');
  });

  /* 房间号：嵌在大厅里才显示，点一下复制 */
  if (ROOM_CODE) {
    $('roomCode').hidden = false;
    $('roomCodeNum').textContent = ROOM_CODE;
    $('roomCode').onclick = async () => {
      try { await navigator.clipboard.writeText(ROOM_CODE); toast('房间号已复制'); }
      catch (e) { toast('房间号 ' + ROOM_CODE); }
      sfx('coin');
    };
  }

  /* ---------------- 启动 ---------------- */
  if (!B) {
    $('qtext').textContent = '题库没加载出来，刷新一下页面。';
  } else {
    renderCats(); renderTags(); updateCount();
    /* 首次进来先给一张，避免空场 */
    setTimeout(() => { if (!flipped) draw(); }, 420);
  }
  try { window.QCSFX?.unlock(); } catch (e) { }
})();
</script>
</body>
</html>
